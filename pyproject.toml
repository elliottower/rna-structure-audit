[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rna-structure-audit"
version = "0.2.1"
description = "Three-rung benchmark for evaluating whether RNA/DNA foundation models encode genuine secondary structure or composition shortcuts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Elliot Tower", email = "elliot@elliottower.ai"},
]
keywords = ["RNA", "foundation-models", "benchmark", "secondary-structure", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
all-models = [
    "transformers>=4.30.0",
    "multimolecule>=0.2.0",
    "einops>=0.6.0",
]
experiments = [
    "rna-fm",
    "matplotlib",
    "biopython",
    "multimolecule>=0.2.0",
    "transformers<5",
    "tensorly>=0.9.0",
]

[project.scripts]
rna-structure-audit = "rna_structure_audit.cli:main"

[project.urls]
Homepage = "https://github.com/elliottower/rna-structure-audit"

[tool.hatch.build.targets.wheel]
packages = ["src/rna_structure_audit"]

# Without an explicit list the sdist takes everything git does not ignore, which
# here is the analysis tree: 415 result files, the manuscripts and the figures,
# 22 MB of research artifacts shipped to anyone running `pip download`. The
# repository is where those live; the sdist carries what builds and tests the
# package.
[tool.hatch.build.targets.sdist]
include = [
  "src/rna_structure_audit",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "docs/CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
