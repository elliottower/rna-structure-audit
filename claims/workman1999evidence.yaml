claims:
  dinuc-null:
    interpretation:
      says: mRNA folding energies are indistinguishable from dinucleotide-matched random sequences
      whose: rna-structure-audit
    quotes:
    - exact: the predicted free energy is not significantly different from random sequences with the same
        dinucleotide distribution
  stacking:
    interpretation:
      says: The dinucleotide distribution matters because stacking energies set stability
      whose: rna-structure-audit
    quotes:
    - exact: dinucleotide distribution is important for determining the significance of secondary structure,
        which is not surprising since stacking energies are crucial for the stability of RNA structure
