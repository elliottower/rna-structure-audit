claims:
  control-tasks:
    interpretation:
      says: A probe's accuracy should be read against a control task that only the probe can learn
      whose: rna-structure-audit
    quotes:
    - exact: we propose control tasks, which associate word types with random outputs, to complement linguistic
        tasks. By construction, these tasks can only be learned by the probe itself.
  selectivity:
    interpretation:
      says: Selectivity is the gap between task accuracy and control-task accuracy
      whose: rna-structure-audit
    quotes:
    - exact: So a good probe, (one that reflects the representation), should be selective, achieving high
        linguistic task accuracy and low control task accuracy.
