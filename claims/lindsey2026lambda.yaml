claims:
  random-baseline:
    interpretation:
      says: Pretrained embeddings beat the same models' randomly initialized embeddings on the benchmark's
        probing tasks
      whose: rna-structure-audit
    quotes:
    - exact: pretrained embeddings outperformed randomly initialized embeddings under both linear probing
        and shallow nonlinear classification
  gc-shuffle:
    interpretation:
      says: On a GC-preserving shuffle of the test set, GC composition explains little of the models'
        performance
      whose: rna-structure-audit
    quotes:
    - exact: all models had MCC values that fell within ±0.16 of zero, indicating that GC-composition
        accounts for only a small fraction of model performance
