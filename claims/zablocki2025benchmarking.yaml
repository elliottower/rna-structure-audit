claims:
  top-three:
    interpretation:
      says: On random partitions of ArchiveII the three best RNA language models for secondary structure
        prediction are ERNIE-RNA, RiNALMo and RNA-FM
      whose: rna-structure-audit
    quotes:
    - exact: Those are ERNIE-RNA and RiNALMo, both with F1 = 0.95, and RNA-FM with F1 = 0.91.
  harder-split:
    interpretation:
      says: Under an 80 percent sequence-identity split only ERNIE-RNA and RiNALMo beat a classical predictor
      whose: rna-structure-audit
    quotes:
    - exact: These two RNA-LLM are the only ones that achieve better performance than the classical prediction
        method (F1 = 0.53)
  low-homology:
    interpretation:
      says: Two models lead and generalization at low homology is hard
      whose: rna-structure-audit
    quotes:
    - exact: Results showed that two LLM clearly outperform the other models, and revealed significant
        challenges for generalization in low-homology scenarios.
