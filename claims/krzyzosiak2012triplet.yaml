claims:
  stability:
    interpretation:
      says: Hairpin stability scales with repeat count
      whose: rna-structure-audit
      status: contested
      contest: The source compares expanded with normal repeats and does not state a dose-response in
        repeat count. de Mezer et al. report that the mutant HTT CAG structure was not stable enough to
        be protected from siRNA cleavage.
    quotes:
    - exact: expanded repeats are likely to form hairpin structures in cells which make them both more
        prone (increased repeat length) and more resistant (more stable structure) to interaction with
        targeting reagents in comparison with normal repeats.
