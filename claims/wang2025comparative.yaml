    interpretation:
      says: A review compared RNA language models with DNA and protein language models as controls on
        zero-shot secondary structure prediction
      whose: rna-structure-audit
    quotes:
    - exact: compared 13 RNA LMs along with 3 DNA and 1 protein LMs as controls in zeroshot prediction
        of RNA secondary structure and functional classification
  dna-none:
    interpretation:
      says: DNA language models carried no secondary-structure information in zero-shot prediction
      whose: rna-structure-audit
    quotes:
    - exact: As expected, DNA LMs and Class II RNA LMs contain no secondarystructural information, indicating
        the importance of ncRNA sequence libraries employed for pre-training of RNA foundation models.
